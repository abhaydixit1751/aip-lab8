<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Subrat Panda">
<meta name="description" content="AI in Practice 2, introduction -- the course as one evolving story: what partners will expect in January, the prerequisites and the toolkit, how thirty-five unknowns become knowns lab by lab, how the labs evolve, and how it all prepares you for the Immersion and the capstone.">
<title>AI in Practice 2 · The Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FCFCFD; --surface:#F1F3F6; --sunk:#E7EAEF;
  --ink:#14161B; --body:#2B303A; --muted:#626A78; --faint:#8A929F;
  --rule:#DCE0E7; --rule-strong:#BFC5D0;
  --slate:#16212E; --slate-2:#1E2C3D; --slate-ink:#E9EDF3; --slate-muted:#8FA3BC;
  --accent:#AE4224; --accent-ink:#8E3520; --accent-soft:#F7E7E1;
  --teal:#1D5E5C; --teal-soft:#DCEBE8;
  --gold:#8A6A16; --gold-soft:#F6EEDA;
  --ok:#1F6B45; --ok-soft:#DFF0E6;
  --shadow:0 1px 2px rgba(20,22,27,.06), 0 18px 44px -28px rgba(20,22,27,.4);
  --stage-w:1280px; --stage-h:720px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0F14}
body{font-family:"Source Serif 4",Georgia,serif;color:var(--body);-webkit-font-smoothing:antialiased}
.ui{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#stage{position:absolute;top:50%;left:50%;width:var(--stage-w);height:var(--stage-h);
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.slide{position:absolute;inset:0;padding:56px 72px;display:none;flex-direction:column;
  background:var(--paper);animation:in .28s ease both}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

/* ---------- typography ---------- */
h1{font-family:Archivo,sans-serif;font-size:56px;font-weight:700;line-height:1.03;
  letter-spacing:-.025em;margin:0 0 16px;color:#fff;text-wrap:balance}
h2{font-family:Archivo,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.018em;
  margin:0 0 6px;color:var(--ink);line-height:1.12;text-wrap:balance}
h3{font-family:Archivo,sans-serif;font-size:15px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px}
p{margin:0 0 15px;font-size:22px;line-height:1.5;max-width:64ch}
.sub{font-size:19px;color:var(--accent-ink);font-weight:600;font-family:Archivo,sans-serif;
  margin:-2px 0 20px}
.rule{height:2px;background:var(--ink);margin:14px 0 26px;flex:none}
.small{font-size:17px;line-height:1.45;color:var(--muted)}
.tiny{font-size:14.5px;line-height:1.45;color:var(--faint)}
b,strong{font-weight:600;color:var(--ink)}
em{font-style:italic}
.body-scroll{overflow-y:auto;flex:1;min-height:0;padding-right:6px}

/* ---------- title & section slides ---------- */
.dark{background:var(--slate);color:var(--slate-ink)}
.dark h2{color:#fff}.dark p{color:#C3D0E0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--slate-muted);margin:0 0 26px}
.tick{width:74px;height:5px;background:var(--accent);margin:0 0 30px;border-radius:2px}
.byline{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid rgba(255,255,255,.14);padding-top:18px;
  font-family:Archivo,sans-serif;font-size:15px;color:var(--slate-muted)}
.byline b{color:#fff;font-weight:600;display:block;font-size:17px}
.secnum{font-family:"IBM Plex Mono",monospace;font-size:80px;font-weight:600;
  color:rgba(255,255,255,.16);line-height:1;margin-bottom:4px}

/* ---------- statement ---------- */
.statement{font-family:Archivo,sans-serif;font-size:40px;font-weight:600;line-height:1.24;
  letter-spacing:-.016em;color:#fff;max-width:24ch;margin:0}
.attrib{margin-top:26px;font-size:18px;line-height:1.5;color:#A9BBD0;max-width:62ch;
  font-family:"Source Serif 4",serif}

/* ---------- generic blocks ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:18px 20px}
.card h4{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.card.good h4{color:var(--ok)} .card.bad h4{color:var(--accent-ink)}
.card ul{margin:0;padding-left:18px} .card li{font-size:17px;line-height:1.42;margin-bottom:8px}
.card li:last-child{margin-bottom:0}

.pull{border-left:4px solid var(--accent);background:var(--accent-soft);
  padding:16px 22px;border-radius:0 7px 7px 0;margin:6px 0 18px}
.pull p{margin:0;font-size:20px;color:var(--ink)}

table{border-collapse:collapse;width:100%;font-size:17px}
th{font-family:Archivo,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);text-align:left;padding:0 14px 8px 0;
  border-bottom:2px solid var(--rule-strong)}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.38}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;padding-right:0;font-family:"IBM Plex Mono",monospace}

pre{font-family:"IBM Plex Mono",monospace;font-size:15.5px;line-height:1.5;
  background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:16px 20px;margin:0;overflow:auto;color:var(--ink)}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em;background:var(--sunk);
  padding:1px 5px;border-radius:4px}

/* ---------- fragments ---------- */
.frag{opacity:.12;filter:blur(.4px);transition:opacity .3s,filter .3s,transform .3s}
.frag.show{opacity:1;filter:none}
@media (prefers-reduced-motion:reduce){.frag{transition:none}}

/* ---------- interactive: reveal ---------- */
.reveal-btn{font-family:Archivo,sans-serif;font-size:14px;font-weight:600;
  background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 16px;
  cursor:pointer;letter-spacing:.02em}
.reveal-btn:hover{background:var(--accent)}
.reveal-body{display:none;margin-top:14px}
.reveal-body.open{display:block;animation:in .25s ease both}

/* ---------- interactive: clickable rows ---------- */
.exp{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:7px;
  background:var(--paper)}
.exp summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;gap:14px;
  align-items:center;font-size:17px;background:var(--surface)}
.exp summary::-webkit-details-marker{display:none}
.exp summary:hover{background:var(--sunk)}
.exp[open] summary{background:var(--ink);color:#fff}
.exp[open] summary .idx{background:var(--accent);color:#fff}
.exp .idx{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  background:var(--sunk);color:var(--muted);width:26px;height:26px;border-radius:5px;
  display:grid;place-items:center;flex:none}
.exp .ttl{font-family:Archivo,sans-serif;font-weight:600;flex:none;min-width:210px}
.exp .hint{color:var(--muted);font-size:15.5px}
.exp[open] summary .hint{color:#B9C4D2}
.exp .detail{padding:14px 16px 16px 56px;font-size:17px;line-height:1.5}
.exp .detail .fix{margin-top:9px;padding-left:12px;border-left:3px solid var(--ok);
  color:var(--ink)}

/* ---------- interactive: boundary chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.chip{font-family:Archivo,sans-serif;font-size:16px;font-weight:600;padding:9px 15px;
  border-radius:7px;border:1.5px solid var(--rule-strong);background:var(--paper);
  cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ink)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.done{border-color:var(--rule);color:var(--faint)}
#bslot{min-height:132px;background:var(--surface);border:1px solid var(--rule);
  border-radius:9px;padding:18px 22px}
#bslot .who{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:8px}
#bslot .who.code{color:var(--ok)} #bslot .who.model{color:var(--accent-ink)}
#bslot .why{font-size:19px;line-height:1.45;margin:0}

/* ---------- interactive: cost calculator ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.ctl{margin-bottom:15px}
.ctl label{display:flex;justify-content:space-between;font-family:Archivo,sans-serif;
  font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px}
.ctl label b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.readout{background:var(--slate);border-radius:10px;padding:20px 22px;color:var(--slate-ink)}
.readout .row{display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.11)}
.readout .row:last-child{border-bottom:none}
.readout .lbl{font-family:Archivo,sans-serif;font-size:14px;color:var(--slate-muted)}
.readout .val{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;color:#fff}
.readout .val.big{font-size:31px}
.readout .val.accent{color:#F0A18A}
.verdict{margin-top:12px;font-size:16px;line-height:1.45;color:#C3D0E0;font-family:"Source Serif 4",serif}

/* ---------- interactive: layer stack ---------- */
.stack{display:flex;flex-direction:column-reverse;gap:5px}
.layer{display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:7px;
  background:var(--surface);border:1px solid var(--rule);cursor:pointer;transition:.15s}
.layer:hover{border-color:var(--rule-strong);transform:translateX(3px)}
.layer.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.layer.hl{border-color:var(--accent);border-width:2px}
.layer .no{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--faint);width:16px}
.layer.active .no{color:#8FA3BC}
.layer .nm{font-family:Archivo,sans-serif;font-weight:600;font-size:16px;min-width:150px}
.layer .ds{font-size:15.5px;color:var(--muted)}
.layer.active .ds{color:#B9C4D2}
#lslot{margin-top:14px;background:var(--accent-soft);border-left:4px solid var(--accent);
  border-radius:0 7px 7px 0;padding:14px 18px;font-size:17px;line-height:1.45;min-height:74px}
#lslot .mod{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--accent-ink);
  font-weight:600;display:block;margin-bottom:5px}

/* ---------- references ---------- */
.refs{display:grid;gap:9px}
.ref{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:11px 0;
  border-bottom:1px solid var(--rule);font-size:16.5px;line-height:1.42}
.ref:last-child{border-bottom:none}
.ref .tag{font-family:Archivo,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;background:var(--muted);border-radius:4px;
  padding:3px 8px;height:fit-content;text-align:center}
.ref .tag.paper{background:var(--teal)} .ref .tag.doc{background:var(--gold)}
.ref .tag.repo{background:var(--accent)} .ref .tag.book{background:var(--slate-2)}
.ref a{color:var(--accent-ink);word-break:break-word}
.ref .why{display:block;color:var(--muted);font-size:15px;margin-top:3px}

/* ---------- chrome ---------- */
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);z-index:40;
  transition:width .25s}
#hud{position:fixed;right:16px;bottom:14px;z-index:40;font-family:Archivo,sans-serif;
  font-size:13px;color:#8895A6;display:flex;gap:14px;align-items:center}
#hud kbd{font-family:"IBM Plex Mono",monospace;background:#1A222C;color:#B9C4D2;
  border-radius:4px;padding:2px 6px;font-size:11.5px}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;z-index:50;
  background:#0E141B;color:#C7D2E0;border-top:2px solid var(--accent);padding:18px 26px;
  display:none;font-size:15.5px;line-height:1.55}
#notes.on{display:block}
#notes h5{font-family:Archivo,sans-serif;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#7A8899;margin:0 0 8px}
#notes b{color:#fff}
#grid{position:fixed;inset:0;z-index:60;background:#0B0F14;overflow:auto;padding:26px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;
  align-content:start}
#grid.on{display:grid}
.thumb{background:var(--paper);border-radius:7px;padding:12px;cursor:pointer;
  border:2px solid transparent;min-height:104px}
.thumb:hover,.thumb.cur{border-color:var(--accent)}
.thumb .tn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
.thumb .tt{font-family:Archivo,sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);
  margin-top:5px;line-height:1.28}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* --- per-slide density adjustments -------------------------------------
   Measured, not guessed: these two slides overflowed the 1280x720 stage by
   33px and 25px respectively. A slide that overflows is silently cropped on
   a projector, so the deck self-checks -- see the console helper at the
   bottom of the script. --------------------------------------------------- */
.slide.tight p{margin-bottom:10px;font-size:20.5px}
.slide.tight .rule{margin:9px 0 15px}
.slide.tight .ctl{margin-bottom:10px}
.slide.tight .pull{margin:4px 0 0;padding:13px 20px}
.slide.tight .pull p{font-size:18px}
.slide.tight table{font-size:16.5px}
.slide.tight table td{padding:6px 14px 6px 0}
.slide.tight .sub{margin:-2px 0 12px}
.slide.tight h2{font-size:34px}

@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #stage{position:static;transform:none!important;width:100%;height:auto;box-shadow:none}
  .slide{display:flex!important;position:relative;page-break-after:always;
    height:190mm;animation:none}
  .frag{opacity:1!important;filter:none!important}
  .reveal-body{display:block!important}
  .exp .detail{display:block!important}
  #bar,#hud,#notes,#grid{display:none!important}
}
</style>
</head>
<body>

<div id="stage" aria-live="polite"></div>
<div id="bar"></div>
<div id="hud">
  <span id="pos" class="mono">1 / 1</span>
  <span><kbd>←</kbd><kbd>→</kbd> move</span>
  <span><kbd>S</kbd> notes</span>
  <span><kbd>O</kbd> overview</span>
  <span><kbd>F</kbd> full</span>
</div>
<div id="notes"><h5>Speaker notes</h5><div id="notesbody"></div></div>
<div id="grid"></div>

<script>
/* =====================================================================
   AI in Practice 2

   Self-contained. Open in a browser and press F.
     arrows / space  move      S  speaker notes
     O  overview grid          F  full screen
   Run overflowCheck() in the console before presenting.

   Source: instructor/decks/src/J0(.tmpl).js  ·  Rebuild: python instructor/decks/build_html_decks.py

const AUTHOR = "Subrat Panda";

/* The Journey: AI in Practice 2 introduced as one evolving story, visual first.
   Skills: J0.data.json. Lab infographics and the Module 1 recap: infographics.json,
   drawn by infographic.js (shared with the briefings and the pptx PNGs).

const CATS = [{"id": "found", "name": "Engineering foundations"}, {"id": "data", "name": "Models and data"}, {"id": "ship", "name": "Delivery and operations"}, {"id": "sov", "name": "Sovereign AI"}, {"id": "agent", "name": "Agents"}, {"id": "trust", "name": "Trust and safety"}, {"id": "client", "name": "Client delivery"}];
const SKILLS = [{"name": "Git with a team: pull, conflicts, tags", "cat": "found", "week": 1, "lab": "8", "proof": "three laptops, one team repo, every lab graded at its tag"}, {"name": "One reproducible environment (containers)", "cat": "found", "week": 1, "lab": "8", "proof": "the same model, bit for bit, on ARM and x86"}, {"name": "Rebuild a model from a clean clone", "cat": "data", "week": 1, "lab": "8", "proof": "a stranger's clone gives identical predictions"}, {"name": "Version data and pipelines (DVC)", "cat": "data", "week": 1, "lab": "8", "proof": "dvc repro from a clean clone, metrics diff empty"}, {"name": "Track experiments (MLflow)", "cat": "data", "week": 1, "lab": "8", "proof": "two runs compared, the difference explained"}, {"name": "Find leakage with evidence", "cat": "data", "week": 1, "lab": "8", "proof": "AUC 0.997 shown to be 0.922 honestly"}, {"name": "Choose a threshold in rupees", "cat": "data", "week": 1, "lab": "8", "proof": "the operating point priced, 197 : 1 error costs"}, {"name": "A typed API contract", "cat": "found", "week": 1, "lab": "9", "proof": "malformed requests never get a 500"}, {"name": "Write a production Dockerfile", "cat": "found", "week": 1, "lab": "9", "proof": "2.57 GB naive image down to 698 MB, non-root"}, {"name": "Measure latency and load", "cat": "ship", "week": 1, "lab": "9", "proof": "cold start and the knee of the load curve"}, {"name": "Work with AI coding agents, spec first", "cat": "found", "week": 2, "lab": "10", "proof": "agents' code reviewed against your own tests"}, {"name": "Write tests that define done", "cat": "found", "week": 2, "lab": "10", "proof": "red tests before any agent code"}, {"name": "Training–serving skew", "cat": "data", "week": 2, "lab": "11", "proof": "recall 0.724 falls to 0.609 as served; fixed and guarded"}, {"name": "Uncertainty: the bootstrap", "cat": "data", "week": 2, "lab": "11", "proof": "the retrained model beats review-everything in 59.5% of resamples"}, {"name": "CI that "name": "Attack an agent through its tools", "cat": "trust", "week": 6, "lab": "18", "proof": "poisoned records, poisoned tools, false authority"}, {"name": "Defend the action, in code", "cat": "trust", "week": 6, "lab": "18", "proof": "blocked attacks 0.88 → 0.99 on the local model"}, {"name": "Scope a vague ask into a signed page", "cat": "client", "week": 6, "lab": "19", "proof": "an interview, a baseline, a signature"}, {"name": "A working slice from a clean clone", "cat": "client", "week": 7, "lab": "20", "proof": "the gate fails on a deliberate break, live"}, {"name": "Answer a change request with a price", "cat": "client", "week": 7, "lab": "20", "proof": "the client's change separated, priced, decided"}, {"name": "Demo under pressure, limits included", "cat": "client", "week": 8, "lab": "21", "proof": "eight minutes, live, to a panel"}, {"name": "Hand it over: runbook, ADRs, on-call", "cat": "client", "week": 8, "lab": "21", "proof": "someone who never met you can run it"}];
const IG = {
 "_note": "One infographic per lab (Given -> You build -> You prove) and the Module 1 recap. Short on purpose: <= 6 words per box. Numbers from instructor/MEASURED_RESULTS.md (AiP-2) and the Module 1 lab READMEs' reference columns. Rendered by infographic.js in J0 (The Journey) and in every pre-lab briefing.",
 "LABS": {
  "8":  {"title": "The model is not the system", "arc": "A", "ask": "“Trained and tested. Please deploy.”",
         "given": ["data", "A model and 45,365 claims"], "build": ["gear", "A pipeline anyone can rebuild"],
         "big": "0.997 → 0.922", "cap": "the leak exposed, honest AUC", "tools": ["git", "DVC", "MLflow"]},

/* Infographics: one per lab (Given -> You build -> You prove) and the Module 1 recap.
   Shared by J0 (The Journey), every pre-lab briefing, and build_infographics.py (PNG/SVG
   for the pptx). Data: instructor/decks/src/infographics.json. Pure SVG strings. */

const IG_THEME = {               /* CSS variables in the decks; hex in standalone files */
  ink: "var(--ink)", body: "var(--body)", muted: "var(--muted)", rule: "var(--rule)",
  paper: "var(--paper)", surface: "var(--surface)", accent: "var(--accent)", accentSoft: "var(--accent-soft)",
  teal: "var(--teal)", tealSoft: "var(--teal-soft)", gold: "var(--gold)", goldSoft: "var(--gold-soft)",
};
const IG_ARC = { A: "teal", B: "gold", C: "accent", D: "ink" };

function igEsc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function igWrap(text, max) {                 /* greedy word wrap by characters */
  const out = []; let line = "";
  for (const w of String(text).split(" ")) {
    if ((line + " " + w).trim().length > max && line) { out.push(line); line = w; }
    else line = (line + " " + w).trim();
  }
  if (line) out.push(line);
  return out;
}

function igIcon(name, x, y, c) {             /* 44x44 line icons, top-left at (x, y) */
  const s = `fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"`;
  const g = (inner) => `<g transform="translate(${x},${y})" ${s}>${inner}</g>`;
  const I = {
    data:  `<ellipse cx="22" cy="9" rx="14" ry="5"/><path d="M8 9v24c0 3 6 5 14 5s14-2 14-5V9"/><path d="M8 21c0 3 6 5 14 5s14-2 14-5"/>`,
    model: `<path d="M22 4l16 9v18l-16 9-16-9V13z"/><path d="M6 13l16 9 16-9M22 22v18"/>`,
    gear:  `<circle cx="22" cy="22" r="7"/><path d="M22 4v6M22 34v6M4 22h6M34 22h6M9 9l4 4M31 31l4 4M9 35l4-4M31 13l4-4"/>`,

    doc:   `<path d="M10 4h17l8 8v28H10z"/><path d="M27 4v8h8M15 20h15M15 26h15M15 32h10"/>`,
    robot: `<rect x="8" y="12" width="28" height="22" rx="5"/><circle cx="17" cy="23" r="2.5"/><circle cx="27" cy="23" r="2.5"/><path d="M22 12V6M18 34v5M26 34v5"/>`,
    split: `<path d="M22 40V24M22 24L9 8M22 24l13-16M9 8h7M9 8v7M35 8h-7M35 8v7"/>`,
    link:  `<rect x="4" y="16" width="20" height="12" rx="6"/><rect x="20" y="16" width="20" height="12" rx="6"/>`,
    laptop:`<rect x="8" y="9" width="28" height="19" rx="2"/><path d="M3 34h38"/>`,
    pipe:  `<circle cx="7" cy="22" r="4"/><circle cx="22" cy="22" r="4"/><circle cx="37" cy="22" r="4"/><path d="M11 22h7M26 22h7"/>`,
    clock: `<circle cx="22" cy="22" r="17"/><path d="M22 12v10l7 5"/>`,
    chart: `<path d="M5 39h35"/><rect x="9" y="24" width="6" height="15"/><rect x="19" y="14" width="6" height="25"/><rect x="29" y="6" width="6" height="33"/>`,
    harness:`<path d="M6 32a16 16 0 0132 0"/><path d="M22 32l8-11"/><circle cx="22" cy="32" r="2.5"/>`,
    chip:  `<rect x="11" y="11" width="22" height="22" rx="2"/><path d="M16 5v6M22 5v6M28 5v6M16 33v6M22 33v6M28 33v6M5 16h6M5 22h6M5 28h6M33 16h6M33 22h6M33 28h6"/>`,
    lock:  `<rect x="9" y="20" width="26" height="19" rx="3"/><path d="M14 20v-6a8 8 0 0116 0v6"/><path d="M22 28v4"/>`,
    plug:  `<path d="M16 5v9M28 5v9M11 14h22v8a11 11 0 01-22 0z"/><path d="M22 33v7"/>`,
    shield:`<path d="M22 4l15 6v11c0 10-7 16-15 19C14 37 7 31 7 21V10z"/><path d="M15 22l5 5 9-10"/>`,

    handover:`<rect x="20" y="10" width="20" height="24" rx="2"/><path d="M4 22h14M12 16l6 6-6 6"/>`,
    search:`<circle cx="18" cy="18" r="11"/><path d="M26 26l12 12"/>`,

  };
  return g(I[name] || I.doc);
}

/* One lab: 1000 x 270. */
function labInfographic(n, d, T = IG_THEME) {
  const arcC = T[IG_ARC[d.arc] || "teal"];
  const panel = (x, w, label, icon, text, fill, col) => {
    const lines = igWrap(text, 20).slice(0, 3);
    return `<rect x="${x}" y="78" width="${w}" height="150" rx="14" fill="${fill}" stroke="${col}" stroke-width="2"/>
      ${igIcon(icon, x + 18, 96, col)}
      <text x="${x + 74}" y="112" font-family="Archivo,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="${T.muted}">${label}</text>
      ${lines.map((l, i) => `<text x="${x + 20}" y="${166 + i * 26}" font-family="Source Serif 4,Georgia,serif" font-size="22" fill="${T.ink}">${igEsc(l)}</text>`).join("")}`;
  };
  const arrow = (x) => `<path d="M${x} 153h30M${x + 20} 143l10 10-10 10" fill="none" stroke="${T.muted}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const bigSize = d.big.length > 14 ? 28 : d.big.length > 12 ? 34 : d.big.length > 8 ? 42 : 52;
  const capLines = igWrap(d.cap, 26).slice(0, 2);
  return `<svg viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lab ${n} at a glance" style="width:100%;height:auto;display:block">
    <rect x="0" y="6" width="8" height="52" rx="3" fill="${arcC}"/>
    <text x="22" y="28" font-family="Archivo,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="${T.muted}">LAB ${n} · ARC ${d.arc}</text>
    <text x="22" y="56" font-family="Archivo,Helvetica,sans-serif" font-size="28" font-weight="700" fill="${T.ink}">${igEsc(d.title)}</text>
    <text x="1000" y="50" text-anchor="end" font-family="Source Serif 4,Georgia,serif" font-size="21" font-style="italic" fill="${T.body}">${igEsc(d.ask)}</text>
    ${panel(0, 290, "GIVEN", d.given[0], d.given[1], T.surface, T.muted)}
    ${arrow(300)}
    ${panel(342, 290, "YOU BUILD", d.build[0], d.build[1], T.tealSoft, T.teal)}
    ${arrow(642)}
    <rect x="684" y="78" width="316" height="150" rx="14" fill="${T.accentSoft}" stroke="${T.accent}" stroke-width="2"/>
    <text x="706" y="112" font-family="Archivo,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="${T.muted}">YOU PROVE</text>
    <text x="706" y="${bigSize > 40 ? 166 : 160}" font-family="Archivo,Helvetica,sans-serif" font-size="${bigSize}" font-weight="800" fill="${T.accent}">${igEsc(d.big)}</text>
    ${capLines.map((l, i) => `<text x="706" y="${196 + i * 22}" font-family="Source Serif 4,Georgia,serif" font-size="18" fill="${T.body}">${igEsc(l)}</text>`).join("")}
    <text x="0" y="262" font-family="IBM Plex Mono,Menlo,monospace" font-size="15" fill="${T.muted}">${d.tools.map(igEsc).join("  ·  ")}</text>
  </svg>`;
}

/* Module 1, Labs 1-7: a timeline, 1000 x 330. */
function m1Recap(items, T = IG_THEME) {
  const w = 1000 / items.length;
  const cols = items.map((it, i) => {
    const cx = w * i + w / 2;
    const made = igWrap(it.made, 16).slice(0, 2);
    const big = it.big.length > 9 ? 17 : it.big.length > 5 ? 22 : 30;
    return `<circle cx="${cx}" cy="64" r="34" fill="${T.paper}" stroke="${T.teal}" stroke-width="3"/>
      ${igIcon(it.icon, cx - 22, 42, T.teal)}
      <text x="${cx}" y="126" text-anchor="middle" font-family="Archivo,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="${T.muted}">LAB ${it.n}</text>
      <text x="${cx}" y="150" text-anchor="middle" font-family="Archivo,Helvetica,sans-serif" font-size="16" font-weight="700" fill="${T.ink}">${igEsc(it.title.length > 16 ? it.title.split(" ").slice(0, 2).join(" ") : it.title)}</text>
      ${it.title.length > 16 ? `<text x="${cx}" y="170" text-anchor="middle" font-family="Archivo,Helvetica,sans-serif" font-size="16" font-weight="700" fill="${T.ink}">${igEsc(it.title.split(" ").slice(2).join(" "))}</text>` : ""}
      ${made.map((l, j) => `<text x="${cx}" y="${200 + j * 20}" text-anchor="middle" font-family="Source Serif 4,Georgia,serif" font-size="16" fill="${T.body}">${igEsc(l)}</text>`).join("")}
      <text x="${cx}" y="276" text-anchor="middle" font-family="Archivo,Helvetica,sans-serif" font-size="${big}" font-weight="800" fill="${T.accent}">${igEsc(it.big)}</text>
      <text x="${cx}" y="300" text-anchor="middle" font-family="Source Serif 4,Georgia,serif" font-size="14" fill="${T.muted}">${igEsc(it.cap)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Module 1, Labs 1 to 7" style="width:100%;height:auto;display:block">
    <path d="M${w / 2} 64H${1000 - w / 2}" stroke="${T.rule}" stroke-width="4"/>
    ${cols}</svg>`;
}

function mountAll(){
  const map=document.getElementById('umap'), sl=document.getElementById('wkslider'),
        lb=document.getElementById('wklabel'), out=document.getElementById('uslot');
  if(!map) return;
  map.innerHTML=CATS.map(c=>`<div class="ucol"><h5>${c.name}</h5>${
    SKILLS.map((s,i)=>s.cat===c.id?`<div class="sk" data-i="${i}">${s.name}<small>week ${s.week} · Lab ${s.lab}</small></div>`:"").join("")}</div>`).join("");
  const ARC=w=>w===0?"today":w<=3?"Arc A · Ship it":w===4?"Arc B · Own it":w===5?"Arc C · Let it act":w===6?"Arcs C and D":"Arc D · Deliver it";
  const show=w=>{ let known=0;
    map.querySelectorAll('.sk').forEach(el=>{ const s=SKILLS[+el.dataset.i];
      el.classList.toggle('known', s.week<w); el.classList.toggle('new', s.week===w);
      if(s.week<=w) known++; });
    lb.textContent=`Week ${w} · ${ARC(w)} · ${known} of ${SKILLS.length} known`; };
  sl.oninput=()=>show(+sl.value);
  map.querySelectorAll('.sk').forEach(el=>el.onclick=()=>{ const s=SKILLS[+el.dataset.i];
    out.innerHTML=`<b>${s.name}</b>: Lab ${s.lab}, week ${s.week}. You prove it when ${s.proof}.`; });
  show(0);
}

/* ===================== engine ======================================= */
const stage=document.getElementById('stage'), bar=document.getElementById('bar'),
      pos=document.getElementById('pos'), notes=document.getElementById('notes'),
      notesBody=document.getElementById('notesbody'), grid=document.getElementById('grid');
let i=0, frag=0, fragEls=[];

function fit(){
  const s=Math.min(innerWidth/1280, innerHeight/720)*0.94;
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit);

function build(){
  stage.innerHTML = SLIDES.map((s,n)=>
    `<section class="slide ${s.cls||''}" data-n="${n}">${s.html}</section>`).join('');
  grid.innerHTML = SLIDES.map((s,n)=>
    `<div class="thumb" data-go="${n}"><div class="tn">${String(n+1).padStart(2,'0')}</div>
     <div class="tt">${s.t}</div></div>`).join('');
  grid.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{go(+el.dataset.go);toggleGrid(false);});
  mountReveals(); if (typeof mountAll === 'function') mountAll();
}

function go(n,f){
  i=Math.max(0,Math.min(SLIDES.length-1,n));
  stage.querySelectorAll('.slide').forEach(el=>el.classList.toggle('on',+el.dataset.n===i));
  const cur=stage.querySelector('.slide.on');
  fragEls=[...cur.querySelectorAll('.frag')];
  frag = f==='end' ? fragEls.length : 0;
  paint();
  notesBody.innerHTML = SLIDES[i].notes || '<i style="color:#66738a">No notes for this slide.</i>';
  pos.textContent=`${i+1} / ${SLIDES.length}`;
  bar.style.width=`${((i+1)/SLIDES.length)*100}%`;
  grid.querySelectorAll('.thumb').forEach((t,n)=>t.classList.toggle('cur',n===i));
  location.hash=i+1;
}
function paint(){ fragEls.forEach((el,n)=>el.classList.toggle('show',n<frag)); }
function next(){ if(frag<fragEls.length){frag++;paint();} else if(i<SLIDES.length-1) go(i+1); }
function prev(){ if(frag>0){frag--;paint();} else if(i>0) go(i-1,'end'); }
function toggleGrid(on){ grid.classList.toggle('on', on===undefined?!grid.classList.contains('on'):on); }

addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='pagedown'){e.preventDefault();next();}
  else if(k==='arrowleft'||k==='pageup'){e.preventDefault();prev();}
  else if(k==='home')go(0); else if(k==='end')go(SLIDES.length-1);
  else if(k==='s'){notes.classList.toggle('on');}
  else if(k==='o'){toggleGrid();}
  else if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(k==='escape'){toggleGrid(false);notes.classList.remove('on');}
});


/* Generic: any <button data-reveal="id"> toggles <div id="id" class="reveal-body">. */
function mountReveals(){
  document.querySelectorAll('[data-reveal]').forEach(btn=>btn.onclick=()=>{
    const body=document.getElementById(btn.dataset.reveal);
    body.classList.toggle('open');
    btn.textContent = body.classList.contains('open') ? 'Hide the answer' : 'Reveal the answer';
  });
}

/* Generic: expandable rows. Each item {n,t,s,d,fix}. */
function expList(items){
  return items.map(f=>`
    <div class="exp"><details><summary>
      <span class="idx">${f.n}</span><span class="ttl">${f.t}</span>
      <span class="hint">${f.s}</span></summary>
      <div class="detail">${f.d}${f.fix?`<div class="fix"><b>${f.fixLabel||'Response'}:</b> ${f.fix}</div>`:''}</div>
    </details></div>`).join('');
}

/* Generic: hidden-answer question list. Each item {q,a}. */
function quizList(items){
  return items.map((q,n)=>`
    <div class="exp"><details><summary>
      <span class="idx">${n+1}</span><span class="hint" style="color:var(--ink)">${q.q}</span>
      </summary><div class="detail" style="padding-left:56px">${q.a}</div></details></div>`).join('');
}

/* Author helper: run overflowCheck() in the console before presenting.
   A slide that overflows the 1280x720 stage is cropped on a projector and you
   will not notice until you are standing in front of the room. */
window.overflowCheck=()=>{
  const bad=[];
  document.querySelectorAll('.slide').forEach((el,n)=>{
    const was=el.classList.contains('on'); el.classList.add('on');
    const over=el.scrollHeight-el.clientHeight;
    if(over>2) bad.push(`slide ${n+1} "${SLIDES[n].t}" overflows by ${over}px`);
    if(!was) el.classList.remove('on');
  });
  console.log(bad.length?bad.join('\n'):'All slides fit the stage.');
  return bad;
};

build(); fit();
go(location.hash ? Math.max(0,parseInt(location.hash.slice(1),10)-1) : 0);
</script>
