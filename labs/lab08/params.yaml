# Lab 8 -- everything that can change the model lives in this file.
run_name: honest-reproducible

data:
  path: data/claims/claims.parquet
  label: rejected
  train_months: [0, 11]
  holdout_months: [12, 13]

model:
  random_state: 42
  hyperparameters:
    max_iter: 250
    learning_rate: 0.08

features:
  numeric:
    - sum_insured
    - eldest_age
    - policy_tenure_months
    - city_tier
    - claim_amount
    - claim_to_si_ratio
    - length_of_stay_days
    - room_rent_ratio
    - claims_in_last_90d
    # Dropped assessor_note_length: target leak. Case notes are written by assessors
    # during manual review (after the triage decision). Auto-approved claims or claims
    # at intake do not yet have an assessor note.
  categorical:
    - plan
    - language
    - channel
    - diagnosis_group
    - admission_type
    - hospital_network
    - claim_route
  boolean:
    - declared_ped
    - documents_complete
    - notified_on_time
