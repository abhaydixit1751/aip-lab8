[project]
name = "aip2"
version = "0.1.0"
description = "AI in Practice 2 — Plaksha University MS in Artificial Intelligence"
requires-python = ">=3.12,<3.13"
# The base set is exactly what the SERVICE needs at runtime -- nothing more.
# Lab 9's slim image installs only this. Training and tooling are groups below.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic>=2.9,<3",
]

[dependency-groups]
train = ["pyarrow==25.0.1", "pyyaml>=6.0"]
versioning = ["dvc>=3.55", "mlflow>=2.18"]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]
# Labs 16-18: MCP servers and the domain agent. In the course image from week 1, so no
# mid-course rebuild; never in a service image (--no-default-groups there).
agents = ["mcp==2.2.0", "openai-agents[litellm]==0.22.3"]

[tool.uv]
package = false
default-groups = ["train", "versioning", "dev", "agents"]
