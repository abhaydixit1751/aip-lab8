[project]
name = "primer-hello"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# What the SERVICE needs at runtime: the only thing in the runtime image.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
# Only in the `test` build target, never in the runtime image (`uv sync --no-dev`).
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false
